[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nhl-scoreboard"
version = "0.1.0"
description = "NHL scoreboard for a HUB75 LED matrix driven by a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mark Goudie" }]
dependencies = [
    "requests>=2.31",
    "pillow>=10",
    # Only tomlkit round-trips scoreboard.toml (parse -> edit -> dump) without
    # dropping the file's per-setting comments; stdlib tomllib is read-only,
    # and a plain dict-based writer would throw the comments away (#51).
    "tomlkit>=0.12",
    # For the AP-mode setup scene's join QR code (#131 follow-up) -- just
    # the module-matrix computation, no image/PIL rendering path used.
    "qrcode>=7",
    # admin_server.py's page + WebSocket (#178), deployed to the real
    # device as of story 10 -- python3-websockets is a real apt package on
    # this image's Debian release (confirmed live, trixie ships 15.0.1-1),
    # added to image/layer/nhl-scoreboard.yaml's package list alongside
    # this. Was dev-extras-only through story 9, before deployment.
    "websockets>=13",
]

[project.optional-dependencies]
emulator = ["RGBMatrixEmulator>=0.11"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "RGBMatrixEmulator>=0.11",
    "responses>=0.25",
    "cairosvg>=2.7",
    "smbus2>=0.4",
    # button.py's tests drive the real gpiozero.Button through its MockFactory;
    # on the board it comes from apt (python3-gpiozero), same as smbus above.
    "gpiozero>=1.6",
]
# tests/e2e/ (#178 story 10's own follow-up): a real Chromium browser
# against a real admin_server.py subprocess serving a real frontend/dist
# build -- kept out of `dev` so the routine `pip install -e '.[dev]'`
# every other CI job and dev machine runs doesn't pull down a browser
# binary. `playwright install --with-deps chromium` is a separate,
# explicit step only the e2e CI job runs.
e2e = ["playwright>=1.40"]

[project.scripts]
nhl-scoreboard = "nhl_scoreboard.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nhl_scoreboard = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# -m 'not e2e': the default `pytest` run stays the hermetic, offline,
# sub-second suite CLAUDE.md documents -- tests/e2e/ spawns a real
# subprocess and a real browser, explicitly opted into with `-m e2e`
# (see tests/e2e/test_admin_page_smoke.py's own docstring).
addopts = "-q -m 'not e2e'"
markers = ["e2e: real end-to-end test against a live browser and subprocess, not hermetic"]

[tool.coverage.run]
branch = true
source = ["src/nhl_scoreboard"]
# Required by py-cov-action/python-coverage-comment-action: it matches
# .coverage's recorded paths against the PR's changed files, which only
# works with paths relative to the repo root, not absolute runner paths.
relative_files = true

[tool.coverage.report]
show_missing = true
# The measured baseline when coverage reporting was added (#82), not an
# aspirational number -- raise this as coverage gaps get filled (#75, #76,
# #77, #78, #79, #81), never lower it to make a drop pass quietly.
fail_under = 88
