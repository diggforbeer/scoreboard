# Image definition for the NHL scoreboard appliance.
#
# Build from the repository root:
#   ./scripts/fetch-vendor.sh
#   rpi-image-gen build -S ./image -c scoreboard.yaml
#
# Output: work/nhl-scoreboard/nhl-scoreboard.img

include:
  file: trixie-minbase.yaml

device:
  layer: rpi4
  hostname: scoreboard
  user1: scoreboard
  # The device-user-credentials layer enforces upper/lower/digit/symbol and a
  # minimum of 8 characters. Change this before exposing the board publicly.
  user1pass: Scoreboard1!
  # 'sudo' must not appear here -- membership is granted by user1sudo, and
  # listing it in both is rejected as a conflict.
  user1groups: video,gpio,i2c,spi
  user1sudo: passwd

image:
  layer: image-rpios
  name: nhl-scoreboard
  boot_part_size: 256M
  # Room for the toolchain used to build the HUB75 bindings, plus headroom.
  root_part_size: 2560M

layer:
  app: nhl-scoreboard

# The base layers default to UK locale and the restrictive '00' wireless
# regulatory domain. The provisioning script resets timezone and regdom from
# scoreboard.toml at boot, but these give sane values before it first runs.
locale:
  default: en_CA.UTF-8
  keyboard_keymap: us
  keyboard_layout: English (US)
  timezone: America/Toronto

ieee80211:
  regdom: CA

sb:
  srcdir: ${@SRCROOT}/..
  assetdir: ${@SRCROOT}/files
  vendordir: ${@SRCROOT}/files/vendor
