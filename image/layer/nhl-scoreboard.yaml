# METABEGIN
# X-Env-Layer-Name: nhl-scoreboard
# X-Env-Layer-Version: 0.1.0
# X-Env-Layer-Category: app
# X-Env-Layer-Desc: NHL scoreboard appliance. Installs the scoreboard
#  application, builds the rpi-rgb-led-matrix Python bindings for the HUB75
#  panel, provisions networkd/iwd configuration, and installs a
#  human-editable settings file on the boot partition.
# X-Env-Layer-Requires: device-user-admin,systemd-net-min,systemd-timesyncd,iwd,rpi-boot-firmware
#
# X-Env-VarPrefix: sb
#
# X-Env-Var-srcdir: /dev/null
# X-Env-Var-srcdir-Desc: Path to the scoreboard source tree (repository root).
# X-Env-Var-srcdir-Required: y
# X-Env-Var-srcdir-Valid: dir
# X-Env-Var-srcdir-Set: y
#
# X-Env-Var-assetdir: /dev/null
# X-Env-Var-assetdir-Desc: Path to image/files containing units and defaults.
# X-Env-Var-assetdir-Required: y
# X-Env-Var-assetdir-Valid: dir
# X-Env-Var-assetdir-Set: y
#
# X-Env-Var-vendordir: /dev/null
# X-Env-Var-vendordir-Desc: Path to vendored third-party source, populated by
#  scripts/fetch-vendor.sh before the build.
# X-Env-Var-vendordir-Required: y
# X-Env-Var-vendordir-Valid: dir
# X-Env-Var-vendordir-Set: y
#
# X-Env-Var-isolated_cpu: 3
# X-Env-Var-isolated_cpu-Desc: CPU core reserved for the matrix refresh thread
#  via isolcpus. Set to empty to disable core isolation.
# X-Env-Var-isolated_cpu-Required: n
# X-Env-Var-isolated_cpu-Valid: string-or-empty
# X-Env-Var-isolated_cpu-Set: y
# METAEND
---
mmdebstrap:
  packages:
    # Runtime
    - python3
    - python3-requests
    - iw
    - ca-certificates
    - alsa-utils
    # For nhl-scoreboard-grow-rootfs: partition inspection (parted) and
    # filesystem growth (resize2fs). util-linux (findmnt, lsblk, sfdisk)
    # is essential and always present, so not listed explicitly.
    - parted
    - e2fsprogs
    # Build-time, for the HUB75 bindings. Upstream builds through
    # scikit-build-core/CMake, not the old bindings/python Makefile.
    - build-essential
    - cmake
    - ninja-build
    - cython3
    - python3-dev
    - python3-pip
    # Supplies /usr/include/python3.x/Imaging.h, which the bindings' Pillow
    # shim includes. Pillow's own wheels ship no C headers, so without this
    # Debian package the extension build fails on shims/pillow.c.
    - python3-pil

  customize-hooks:
    # ---- scoreboard application -------------------------------------
    # Installed as a plain source tree on PYTHONPATH rather than a package:
    # no pip, no network, and nothing to go wrong at first boot.
    - |-
      set -eu
      install -d -m 0755 "$1/opt/nhl-scoreboard"
      cp -a "$IGconf_sb_srcdir/src/nhl_scoreboard" "$1/opt/nhl-scoreboard/"
      find "$1/opt/nhl-scoreboard" -name '__pycache__' -type d -prune -exec rm -rf {} +
      install -d -m 0755 "$1/usr/share/nhl-scoreboard/fonts"
      install -m 0644 "$IGconf_sb_srcdir"/fonts/*.bdf "$1/usr/share/nhl-scoreboard/fonts/"

    # ---- team logos --------------------------------------------------
    # Rasterised on the build host by scripts/fetch-logos.py; the board
    # never fetches artwork at runtime.
    - |-
      set -eu
      LOGOS="$IGconf_sb_srcdir/assets/logos"
      if [ ! -d "$LOGOS/32/dark" ]; then
        echo "ERROR: $LOGOS/32/dark missing. Run scripts/fetch-logos.py first." >&2
        exit 1
      fi
      install -d -m 0755 "$1/usr/share/nhl-scoreboard/logos"
      cp -a "$LOGOS"/. "$1/usr/share/nhl-scoreboard/logos/"
      find "$1/usr/share/nhl-scoreboard/logos" -type f -exec chmod 0644 {} +
      echo "Installed $(find "$1/usr/share/nhl-scoreboard/logos" -name '*.png' | wc -l) logo files"

    # ---- goal horns ----------------------------------------------------
    # The default siren is synthesized and committed to the repo (not
    # third-party copyrighted content, so unlike logos there is nothing to
    # fetch at build time). Team-specific WAVs are a user drop-in slot;
    # none are shipped.
    - |-
      set -eu
      install -d -m 0755 "$1/usr/share/nhl-scoreboard/horns"
      install -m 0644 "$IGconf_sb_srcdir/assets/horns/_default.wav" \
        "$1/usr/share/nhl-scoreboard/horns/"

    # ---- HUB75 driver ------------------------------------------------
    - |-
      set -eu
      SRC="$IGconf_sb_vendordir/rpi-rgb-led-matrix"
      if [ ! -d "$SRC" ]; then
        echo "ERROR: $SRC missing. Run scripts/fetch-vendor.sh first." >&2
        exit 1
      fi
      install -d -m 0755 "$1/usr/src"
      cp -a "$SRC" "$1/usr/src/rpi-rgb-led-matrix"
      # Upstream installs from the repository root through scikit-build-core.
      # This also avoids lib/Makefile's CPU_ARCH_FLAGS, which default to
      # -march=native: building natively on a CI runner would target that
      # runner's CPU and emit instructions a Pi 4's Cortex-A72 lacks. The
      # CMake path compiles with generic flags, so the result runs on any
      # ARMv8 Pi.
      chroot "$1" sh -eu -c '
        cd /usr/src/rpi-rgb-led-matrix
        python3 -m pip install --break-system-packages .
        python3 -c "import rgbmatrix, rgbmatrix.graphics; print(\"rgbmatrix bindings OK\")"
      '

    # ---- services ----------------------------------------------------
    - |-
      set -eu
      install -m 0755 "$IGconf_sb_assetdir/scripts/scoreboard-provision" \
        "$1/usr/local/sbin/scoreboard-provision"
      install -m 0755 "$IGconf_sb_assetdir/scripts/nhl-scoreboard-grow-rootfs" \
        "$1/usr/local/sbin/nhl-scoreboard-grow-rootfs"
      install -m 0644 "$IGconf_sb_assetdir/systemd/nhl-scoreboard.service" \
        "$1/etc/systemd/system/"
      install -m 0644 "$IGconf_sb_assetdir/systemd/scoreboard-provision.service" \
        "$1/etc/systemd/system/"
      install -m 0644 "$IGconf_sb_assetdir/systemd/nhl-scoreboard-grow-rootfs.service" \
        "$1/etc/systemd/system/"

    # ---- boot partition settings file --------------------------------
    - |-
      set -eu
      install -d -m 0755 "$1/boot/firmware"
      install -m 0644 "$IGconf_sb_assetdir/boot/scoreboard.toml" \
        "$1/boot/firmware/scoreboard.toml"

    # ---- firmware configuration --------------------------------------
    # The matrix driver uses the PWM hardware that the onboard analogue
    # audio also claims; they cannot coexist. Isolating a core stops the
    # scheduler from interrupting the refresh thread and causing flicker.
    - |-
      set -eu
      CONFIG="$1/boot/firmware/config.txt"
      if ! grep -q '^# nhl-scoreboard' "$CONFIG" 2>/dev/null; then
        printf '\n%s\n%s\n%s\n' \
          '# nhl-scoreboard: the HUB75 driver needs exclusive use of the PWM' \
          '# peripheral, which the onboard audio output otherwise occupies.' \
          'dtparam=audio=off' >> "$CONFIG"
      fi
      CMDLINE="$1/boot/firmware/cmdline.txt"
      if [ -n "${IGconf_sb_isolated_cpu:-}" ] && ! grep -q 'isolcpus=' "$CMDLINE"; then
        sed -i "1s/\$/ isolcpus=${IGconf_sb_isolated_cpu}/" "$CMDLINE"
      fi

    # ---- enable units ------------------------------------------------
    - $BDEBSTRAP_HOOKS/enable-units "$1" nhl-scoreboard-grow-rootfs
    - $BDEBSTRAP_HOOKS/enable-units "$1" scoreboard-provision
    - $BDEBSTRAP_HOOKS/enable-units "$1" nhl-scoreboard
