# Keep the systemd journal small on the SD card.
#
# The scoreboard's logs are worth keeping across a reboot or a power cut (that is when they are
# needed), so the journal stays on disk, but systemd's default lets it grow to about 10% of the
# card (several GB) with no age limit. Cap its size and age instead. This is also what the admin
# page's Logs tab reads (journalctl -u scoreboard.service).
[Journal]
SystemMaxUse=64M
SystemMaxFileSize=8M
MaxRetentionSec=1week
