# ============================================================
#  NHL Scoreboard settings
# ============================================================
#
#  Edit this file on the SD card's boot partition (it shows up as a small
#  drive on Windows/macOS/Linux after flashing), save it, and put the card
#  back in the Pi. Settings are applied on every boot.
#
#  Lines starting with # are comments and are ignored.
# ------------------------------------------------------------

[wifi]
# Leave ssid empty if you are using a wired ethernet connection.
ssid = ""
password = ""
# Two-letter country code for the wireless regulatory domain, e.g. CA, US, GB.
country = "CA"
# How long to wait for a new SSID/password (from this file, or submitted via
# the first-time AP setup page) to actually connect before giving up and
# rolling back. Also used by the AP setup flow to decide when to stop
# waiting and let you retry.
connect_timeout_seconds = 90

[scoreboard]
# Three-letter team abbreviation, followed as your team's day: a preview of
# the next game, a countdown as puck drop approaches, the live score, the
# final for a while, then the preview of the game after that. Set to "" for
# no preference, which instead rotates through every game in the league
# today. Examples: NSH, TOR, MTL, EDM, VAN, CGY, WPG, OTT, BOS, NYR.
favourite_team = "NSH"

# https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone = "America/Chicago"

# Seconds each game stays on screen when rotating through every game in the
# league (no favourite_team, or nothing to show for your favourite right
# now); also the default dwell time for each idle screen below, unless an
# explicit [[rotation]] list overrides it (see the bottom of this section).
rotate_seconds = 8

# How often to ask the NHL for updated scores, in seconds.
poll_seconds = 60
# Faster polling while a game is actually in progress.
live_poll_seconds = 15

# Within this many hours of puck drop the preview becomes a countdown.
countdown_hours = 2
# How long a finished game stays on the board before the next preview.
final_hold_minutes = 30

# Show a clock when there is no hockey on. Set to false to show "NO GAMES".
show_clock_when_idle = true

# Team logos at each edge of the board. Set to false for the text layout
# (three-letter abbreviations instead of artwork).
show_logos = true
# "dark" artwork is drawn for dark backgrounds and is right for an LED panel;
# several teams' "light" marks are near-black and disappear.
logo_variant = "dark"

# How long the GOAL screen stays up after your team scores before returning
# to the normal live score.
goal_flash_seconds = 6

# How long the follow-up scorer/assist detail screen stays up once it
# fires (later than the GOAL screen above, once the NHL's play-by-play
# catches up with who actually scored).
goal_detail_seconds = 8

# How long the "3 STARS" screen stays up once your team's game is final and
# the NHL has named its three stars, before the final score takes over.
three_stars_seconds = 8

# Whether the favourite's conference playoff picture (their spot plus a
# few teams on either side) is included when no explicit [[rotation]]
# list is given below (see the comment on that section) -- only read for
# that derivation now, not a live on/off switch for the "standings"
# screen itself, so it has no effect once an explicit [[rotation]] is
# present. Not on the admin page for the same reason: once you're editing
# [[rotation]] there, add or remove a "standings" row directly instead of
# toggling this. Only appears once favourite_team has actually played a
# game this season either way.
show_standings = true

# Also cycle the clock into the countdown/preview (and standings, if shown)
# alternation whenever the favourite isn't live -- separate from
# show_clock_when_idle above, which only covers "no games left to preview
# at all".
show_clock_between_games = false

# What shows while there's no live or recently-finished favourite game, by
# default: derived from rotate_seconds/show_standings/show_clock_between_games
# above -- countdown/preview, then standings (if shown), then the clock (if
# enabled), each for rotate_seconds. To control the order or give each
# screen its own duration instead, uncomment and edit an explicit list
# below; once any [[rotation]] table is present, rotate_seconds/
# show_standings/show_clock_between_games above are no longer read for this
# purpose. screen is one of "countdown_preview", "standings", "clock",
# "matchup", "top_west", "top_east", "leaders". "matchup" (your team's
# head-to-head record this season against its next opponent), "top_west"/
# "top_east" (top five of that conference) and "leaders" (your team's top
# goal scorer, top point getter and top two goalies) are never in the
# default list -- they only show if you add them here. A screen with
# nothing to show right now (e.g. standings
# before your team's season has started) is skipped for that pass, not
# shown blank.
#
# [[rotation]]
# screen = "countdown_preview"
# seconds = 10
#
# [[rotation]]
# screen = "standings"
# seconds = 15
#
# [[rotation]]
# screen = "clock"
# seconds = 8

[audio]
# Plays a horn through a USB speaker or USB audio adapter when your team
# scores. The board has no other way to make sound: the HUB75 panel needs
# the Pi's onboard audio hardware for its own timing (see the config.txt
# note about dtparam=audio=off), and I2S conflicts with the panel wiring.
enabled = true

# ALSA device name. Leave empty to use aplay's default output; set this if
# you have more than one audio device, e.g. "plughw:1,0". Run
# `aplay -l` over SSH to see what's attached.
device = ""

# Override where horn WAV files are looked for. Leave empty for the
# built-in location. A file named {ABBR}.wav (e.g. NSH.wav) is used for
# that team's goal if present; otherwise a shipped default siren plays.
# Team-specific horns are not included -- broadcast goal horns are
# copyrighted -- so this is a slot to drop your own recording into.
horn_dir = ""

[status]
# A small web page showing what the board currently thinks is going on
# (current scene, last successful poll, last error, favourite team) plus
# a form to edit this file from a phone on the same
# network -- handy for a headless board without SSH-ing in. On by
# default. No login: this binds the local network the board is on, not
# the internet -- do not port-forward it. Set enabled = false to turn it
# off.
enabled = true
port = 8080

[update]
# Once a day the board asks GitHub Releases whether a newer version exists
# and says so on the status page. It never installs anything by itself --
# that is the "Install" button there. The status page also has a button to
# check on demand. Set enabled = false to stop the daily check.
enabled = true

[wifi_setup]
# The setup page served while the board's own first-boot WiFi access point
# (see nhl-scoreboard-setup-ap) is up -- lets a phone connected to that AP
# pick a network from a scan taken just before the AP came up, or type one
# in by hand, and submit a password. On by default: while the AP is up,
# this is the only way to actually choose a network (the AP itself just
# gets a phone reachable, it doesn't collect credentials). Port 80, not
# status.port's 8080: Apple/Android/Windows captive-portal probes ask for
# plain port 80, and the whole point of this page is to answer those
# probes instead of a "no portal here" response, so it has to be on the
# port they actually ask for.
enabled = true
port = 80

[night_mode]
# Dim the board overnight, but never in the middle of a game: while a game is
# live (and for a while after it ends) the board stays at normal brightness
# however late it is. Takes priority over auto_brightness below while it's
# dimming. Off by default.
enabled = false

# The dim window, 24-hour "HH:MM" in the timezone above. It can wrap past
# midnight, e.g. 22:30 to 07:00.
start_time = "22:30"
end_time = "07:00"

# 0-100 while dimmed. 0 blanks the board completely rather than drawing a
# screen nobody can see.
dim_brightness = 0

# Which games hold off dimming.
#   "tracked"  Only favourite_team's game (with no favourite_team set, this
#              behaves like "all").
#   "all"      Any live game in the league today.
suppress_scope = "tracked"

# How long after that game ends the board stays bright, so the final score
# is still readable. 0 dims the moment it's over.
cooldown_minutes = 15

[holiday]
# Seasonal decorations over the normal screens. Each holiday only appears
# during its own dates, so leaving every one ticked is the normal setting.
# Never drawn over a GOAL / goal-detail / three-stars screen. Off by default.
#   halloween        Oct 1-31: a ghost floats across the board now and then
#                    (games included), and jack-o'-lanterns flank the clock.
#   thanksgiving     The week up to US Thanksgiving: a turkey walks along the
#                    bottom, and autumn leaves flank the clock.
#   thanksgiving_ca  Canadian Thanksgiving's long weekend, same turkey. Not
#                    listed by default; while ticked it takes that weekend
#                    over from Halloween.
enabled = false
themes = ["halloween", "thanksgiving"]

# Random gap, in minutes, between fly-bys (the Halloween ghost).
flyby_min_minutes = 5
flyby_max_minutes = 20

[button]
# An optional momentary push-button: one leg to a GPIO pin, the other to
# GND, no resistor needed. A short press mutes the goal horn for
# mute_minutes; holding it for hold_seconds or longer skips to the next
# game in the rotation instead. Off by default -- turn it on once one is
# wired up. With no button connected, turning this on does no harm.
enabled = false

# BCM GPIO number, not the physical header pin number. 26 (header pin 37,
# next to a GND on pin 39) or 16 are free alongside the LED panel's wiring.
pin = 26

# How long a short press silences the goal horn.
mute_minutes = 60

# How long to hold the button before it counts as a long press. Anything
# under 0.5 is raised to 0.5, so ordinary taps don't register as holds.
hold_seconds = 1.0

[panel]
# Defaults describe two 64x32 panels daisy-chained into one 128x32 board.
rows = 32
cols = 64
chain_length = 2
parallel = 1

# LED pitch in millimetres. Informational only -- the driver does not use it --
# but it lets tools report the display's physical size. P2.5 x 128x32 = 320x80mm.
pitch_mm = 2.5

# Advanced: reorders/rotates pixels before they reach the panel. Leave empty
# unless you know you need it. Common values:
#   "U-mapper"     Fold two panels chained end-to-end into a stacked 64x64
#                  display instead of a 128x32 one (also set chain_length=2,
#                  see rpi-rgb-led-matrix's docs for the wiring this expects)
#   "Rotate:180"   Panel mounted upside down
#   "Mirror:H"     Panel mirrored horizontally
# Chain several with ";", e.g. "U-mapper;Rotate:90".
pixel_mapper = ""

# Which GPIO pins drive the HUB75 signals. Depends on the adapter board:
#   "regular"          Seengreat / XICOOLEE / WatangTech adapter boards, and
#                      direct wiring per the rpi-rgb-led-matrix README.
#                      OE is on GPIO 18, so hardware PWM works unmodified.
#   "adafruit-hat"     Adafruit RGB Matrix Bonnet or HAT, stock.
#   "adafruit-hat-pwm" Adafruit board with the GPIO4-GPIO18 solder mod.
#
# IMPORTANT if the panel stays completely dark after setup: a wrong value
# here does NOT show up as an error anywhere. nhl-scoreboard.service
# starts fine, keeps running, keeps polling the NHL API -- it's just
# driving the wrong physical pins for your actual adapter, so nothing
# ever lights up. Verified on real hardware: an Adafruit RGB Matrix
# Bonnet left on the "regular" default ran for 7+ minutes with an
# entirely healthy, error-free service log and a totally blank panel;
# switching to "adafruit-hat" (no other change) fixed it immediately.
# If your panel is dark, check this line before anything else.
hardware_mapping = "regular"

# The order the three colour wires are actually driven in. Leave at "RGB"
# unless colours look wrong -- if yellow renders pink and/or blue renders
# green, your panel's green/blue wires are swapped from the driver's
# default and "RBG" fixes it. Other panels may need "GRB", "GBR", "BRG",
# or "BGR" instead; try each if "RBG" doesn't fix it.
rgb_sequence = "RGB"

# 0-100. Lower brightness means less current draw and a cooler panel. Used
# as-is unless auto_brightness is on and the sensor below is answering.
brightness = 60

# Auto-dim from a BH1750 ambient light sensor on the I2C bus (#44) instead
# of the fixed brightness above. Leave off if you haven't wired one up --
# it degrades to the fixed brightness on its own if nothing answers, but
# there's no reason to have the board probe the I2C bus for a sensor that
# isn't there.
auto_brightness = false
# Clamp range the sensor reading is mapped into, regardless of how dark or
# bright the room gets.
min_brightness = 10
max_brightness = 100
# How often the sensor is sampled, in seconds. The applied brightness is
# smoothed on top of this, so lowering it won't make the panel flicker.
brightness_poll_seconds = 5

# Raise if the display shows flicker or garbled pixels; 4 suits a Pi 4,
# 2 is usually right for a Pi 3.
gpio_slowdown = 4

# Colour depth. Lower to 8 if refresh looks unstable.
pwm_bits = 11
pwm_lsb_nanoseconds = 130
