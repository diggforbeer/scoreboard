name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: |
          ruff check .
          ruff format --check .

  frontend:
    name: Admin page frontend
    runs-on: ubuntu-latest
    # The frontend is a real shipped artifact now (#178 story 10 --
    # build-image.yml builds it into every image), not just a local-dev
    # tool, so it needs to be part of "CI must be green" like everything
    # else. Node never touches the image itself -- see build-image.yml's
    # own "Build admin frontend" step and CLAUDE.md's Image build facts.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Lint
        working-directory: frontend
        run: npm run lint

  e2e:
    name: Admin page end-to-end smoke test
    runs-on: ubuntu-latest
    # A real Chromium browser against a real admin_server.py subprocess
    # serving a real frontend/dist build -- the same "static page + a
    # WebSocket on one port" mechanism build-image.yml ships, exercised
    # for real instead of trusting `npm run build`/`npm run lint` alone
    # to catch a regression there (#178 story 10's own follow-up: every
    # story before this was verified this way by hand, once, manually).
    # Separate from the `frontend`/`test` jobs above since it needs both
    # a built frontend and the Python package installed.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python package
        run: pip install -e '.[dev,e2e]'
      - name: Install Playwright's Chromium
        run: playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Run the smoke test
        run: pytest tests/e2e -m e2e -v

  test:
    runs-on: ubuntu-latest
    # Needed for the coverage-comment step below: pull-requests:write to
    # post/edit the sticky comment, contents:write to push coverage data
    # to the persistent branch that action uses for diff-coverage across
    # commits. Scoped to this job only, not the whole workflow -- lint/
    # shell/layer-lint don't need either.
    permissions:
      pull-requests: write
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (tomllib); 3.13 is what Debian Trixie ships.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # the coverage-comment action auths its own git ops with the token passed to it below
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest --cov --cov-report=term-missing

      # Runs once, not once per matrix leg -- coverage is identical between
      # 3.11/3.13 (confirmed: both report 88.81% locally and in CI), and
      # posting twice would just be two competing comment updates. Picked
      # 3.13 since that's what the shipped image actually runs.
      - name: Post coverage comment
        if: matrix.python-version == '3.13'
        uses: py-cov-action/python-coverage-comment-action@v4.1
        with:
          GITHUB_TOKEN: ${{ github.token }}

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh image/files/scripts/nhl-scoreboard-grow-rootfs \
            image/files/scripts/nhl-scoreboard-setup-ap

  layer-lint:
    name: Validate image definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse image YAML
        run: |
          pip install pyyaml
          python - <<'PY'
          import sys, pathlib, yaml
          bad = False
          for path in sorted(pathlib.Path("image").rglob("*.yaml")):
              try:
                  yaml.safe_load(path.read_text())
                  print(f"ok   {path}")
              except yaml.YAMLError as exc:
                  print(f"FAIL {path}: {exc}")
                  bad = True
          sys.exit(1 if bad else 0)
          PY
      - name: Check provisioning script compiles
        run: python -m py_compile image/files/scripts/scoreboard-provision
