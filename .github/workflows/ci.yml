name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: |
          ruff check .
          ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (tomllib); 3.13 is what Debian Trixie ships.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh

  layer-lint:
    name: Validate image definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse image YAML
        run: |
          pip install pyyaml
          python - <<'PY'
          import sys, pathlib, yaml
          bad = False
          for path in sorted(pathlib.Path("image").rglob("*.yaml")):
              try:
                  yaml.safe_load(path.read_text())
                  print(f"ok   {path}")
              except yaml.YAMLError as exc:
                  print(f"FAIL {path}: {exc}")
                  bad = True
          sys.exit(1 if bad else 0)
          PY
      - name: Check provisioning script compiles
        run: python -m py_compile image/files/scripts/scoreboard-provision
