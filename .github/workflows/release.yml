name: Release

# Tags and releases every merge to main automatically, so a release never
# again depends on someone remembering to push a tag by hand (see #9).
#
# Versioning is CalVer: vYYYY.MM.DD, with a .1/.2/... suffix for a second
# release the same day. No commit-message discipline required to compute
# it, and nothing needs to be updated in the repo to produce a version --
# pyproject.toml's own version stays a static package version, deliberately
# NOT kept in sync with release tags. That split exists because main's
# ruleset blocks direct pushes; a workflow bumping pyproject.toml would
# itself need a PR (or a bypass-capable bot identity) to land the bump,
# which defeats "automatic". Tags avoid the problem entirely: refs/tags/*
# isn't covered by the branch ruleset (which only governs refs/heads/main),
# so this workflow never needs to push a commit to main at all.
#
# Branch channels (#341): a push to any other branch listed below publishes a
# *pre-release* tagged vYYYY.MM.DD.N-<branch> (e.g. v2026.11.13.2-football)
# with the app-update bundle attached and no flashable image. Boards that
# chose that branch under "Software update" on the admin page follow those
# pre-releases; GitHub's "latest release", which the stable channel and the
# image downloads use, never returns a pre-release, so these never reach
# anyone on main. To add a channel, add its branch name here (lower-case
# letters, digits and hyphens, as it becomes part of the tag).
on:
  push:
    branches: [main, football]

permissions:
  contents: write
  # Needed for the workflow_dispatch call below (POST .../actions/workflows/
  # {id}/dispatches) -- contents:write alone isn't enough; that call fails
  # with "403: Resource not accessible by integration" without this.
  actions: write

concurrency:
  # Serialises release runs so two near-simultaneous merges can't compute
  # the same "next" tag and race to push it.
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute the next CalVer tag
        id: version
        run: |
          set -euo pipefail
          today="$(date -u +%Y.%m.%d)"
          base="v${today}"
          branch="${GITHUB_REF_NAME}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [ "$branch" != "main" ]; then
            # Branch channel: v<date>.<n>-<branch>, numbered from 1 per day.
            n=1
            while git ls-remote --exit-code --tags origin "refs/tags/${base}.${n}-${branch}" >/dev/null 2>&1; do
              n=$((n + 1))
            done
            tag="${base}.${n}-${branch}"
            echo "Next tag: $tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Query the remote directly rather than trust local tag refs --
          # robust regardless of checkout's own tag-fetching behaviour.
          # Branch-channel tags (v...-football) are not main's and don't count.
          existing="$({ git ls-remote --tags origin "refs/tags/${base}*" | grep -v -- '-[a-z0-9-]*$' || true; } | wc -l)"
          if [ "$existing" -eq 0 ]; then
            tag="$base"
          else
            n=1
            while git ls-remote --exit-code --tags origin "refs/tags/${base}.${n}" >/dev/null 2>&1; do
              n=$((n + 1))
            done
            tag="${base}.${n}"
          fi
          echo "Next tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create and push the tag
        run: |
          set -euo pipefail
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create the release
        if: steps.version.outputs.branch == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

      # Branch channels: a pre-release carrying only the app bundle. No image
      # build -- flash a main image once, then follow the branch from the
      # admin page. --prerelease is what keeps it out of "latest".
      - name: Set up Node (branch build)
        if: steps.version.outputs.branch != 'main'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create the branch pre-release with its app bundle
        if: steps.version.outputs.branch != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          (cd frontend && npm ci && npm run build)
          python3 scripts/build-app-bundle.py --version "$tag" --out dist
          gh release create "$tag" \
            --title "$tag" \
            --prerelease \
            --generate-notes \
            --notes "Test build from the \`${{ steps.version.outputs.branch }}\` branch. Not a stable release: it is only offered to boards that chose this branch under Software update." \
            dist/nhl-scoreboard-app.tar.gz dist/manifest.json

      - name: Trigger the image build for this tag
        if: steps.version.outputs.branch == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A tag pushed with GITHUB_TOKEN does NOT trigger build-image.yml's
          # own `tags: ["v*"]` push trigger -- GitHub deliberately does not
          # cascade workflow runs from events the built-in token caused,
          # to prevent recursive triggering. workflow_dispatch is the
          # documented exception: it always creates a run regardless of
          # which token invoked it. That trigger already exists on
          # build-image.yml for manual runs; reused here rather than
          # switching to a PAT or a GitHub App just to make the tag-push
          # trigger work. (A human manually pushing a v* tag with their own
          # credentials still fires that push trigger normally -- kept as
          # a fallback, not removed.)
          gh workflow run build-image.yml --ref "${{ steps.version.outputs.tag }}"
