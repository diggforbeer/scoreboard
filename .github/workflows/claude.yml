name: Claude Code

# Runs Claude Code in GitHub's cloud, on its own token -- separate from any
# locally-run Claude Code session. Only fires on an explicit @claude mention
# (issue body/title, a comment, or a PR review), never on every new issue:
# this repo's workflow is Issues-as-backlog / PRs-as-changes with the owner
# merging everything themselves, and an agent that reacted to every filed
# issue unprompted would work against that, not with it.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history, not a shallow single-commit clone: the git
          # fetch/merge allowlist entries above need real common-ancestor
          # history to resolve a merge conflict against main, which a
          # fetch-depth: 1 checkout doesn't have. Shipping the tool
          # allowlist without this would be a half-working fix.
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Bills against the Claude Code Pro/Max subscription rather than
          # metered API usage. Generate with `claude setup-token` (opens a
          # browser login) and store as this secret -- not ANTHROPIC_API_KEY.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # The action's tag-mode default --allowedTools is a fixed, narrow
          # list (Glob/Grep/LS/Read, a couple of comment/CI MCP tools, git
          # add/commit/push) -- confirmed by reading src/modes/tag/index.ts
          # in anthropics/claude-code-action, not assumed. No general Bash,
          # so it can't run this repo's own test/lint commands. claude_args
          # is appended after that built-in list (same file), which is the
          # documented way to extend it (docs/configuration.md).
          #
          # --append-system-prompt's gh-pr-create instruction overrides a
          # DIFFERENT default that's hard-coded into the base prompt itself
          # (src/create-prompt/index.ts): issue-triggered runs are told to
          # only leave a compare/quick_pull link, never call `gh pr create`.
          # There is no dedicated toggle for that -- this is a best-effort
          # override of baked-in model instructions via an appended system
          # prompt, not a supported switch, so don't treat it as guaranteed;
          # verify with a real `@claude` run before relying on it.
          #
          # `gh issue create`/`gh issue list` added after a real run tried
          # both and got rejected before execution -- it could open its own
          # PR but couldn't file the issues its own research turned up, or
          # check for duplicates first. Same allowlist mechanism as above,
          # not a new one.
          #
          # `gh issue close`/`gh issue view`/`gh label list` added the same
          # way, one run later: it filed #59-#69 fine but couldn't close
          # the review issue (#57) that spawned them, or read/label-check
          # other issues. Deliberately still not `Bash(gh:*)` -- `gh` can
          # do far more than issue/PR management (gh api, gh secret set,
          # gh repo delete, ...) and this workflow triggers off issue/PR
          # content, which isn't fully trusted input even with GitHub's
          # own write-access gate as the first layer. Keep extending this
          # list one confirmed-blocked command at a time, not widening it
          # preemptively.
          #
          # `git fetch`/`git merge`/`gh pr view` added after PR #72 hit a
          # real merge conflict against main and the run couldn't resolve
          # it itself -- the base tagModeTools list (src/modes/tag/
          # index.ts) only ever included `git add`/`git commit`/`git push`/
          # `git rm`, never fetch or merge, so a run's checkout (fetch-
          # depth: 1, one commit) had no way to even pull in main's side of
          # a conflict, let alone resolve one.
          #
          # `Bash(python3:*)`/`Bash(nhl-scoreboard:*)`/`Bash(playwright
          # install:*)` added after a real run (PR #153) was asked to
          # screenshot the admin page and the LED demo scenes and had no
          # way to: it could `pip install playwright` (already covered by
          # the existing `Bash(pip install:*)` entry) but couldn't fetch
          # the actual browser binary, run a screenshot script, or start
          # `nhl-scoreboard --demo --backend RGBMatrixEmulator` to render
          # the panel scenes at all. Getting the resulting PNG into the PR
          # needs no new entry -- `git add`/`commit`/`push` already work,
          # so a run commits the image into its own branch and links it by
          # raw.githubusercontent.com URL rather than trying to attach it.
          # There is no `gh` command that uploads a real image attachment
          # to a PR/issue comment either (`gh issue comment --help` /
          # `gh pr comment --help` only take a text/markdown body, checked
          # directly, not assumed) -- the inline-image drag-and-drop the
          # web UI offers hits an undocumented, session-cookie-authenticated
          # upload endpoint that isn't part of the public API `gh` wraps,
          # so there's no tool to add here for that; the raw.githubusercontent.com
          # link above is the actual mechanism, not a workaround for a
          # missing one.
          #
          # `Bash(. .venv/bin/activate:*)`/`Bash(python3 -m venv:*)` added
          # after PR #159's run reported venv setup and `pytest`/`ruff`
          # "weren't permitted" even though `Bash(python3 -m venv .venv:*)`
          # and `Bash(source .venv/bin/activate:*)` were already present --
          # confirmed by reading that run's own log (`gh run view --log`):
          # the full allowedTools list, both entries included, genuinely
          # reached the SDK (printed verbatim before the run), yet
          # `permission_denials_count: 3` still fired, and the action
          # redacts the actual per-command denial detail ("full output
          # hidden for security"), so the exact command text that failed
          # to match couldn't be confirmed. Best available hypothesis, not
          # confirmed: a syntactic variant of the two already-allowed
          # commands (POSIX `. path` instead of `source path`, or a venv
          # created without the literal `.venv` argument) -- these two
          # additions cover that without widening scope, and it needs a
          # real follow-up run to confirm either way.
          claude_args: |
            --allowedTools "Bash(python3 -m venv .venv:*),Bash(source .venv/bin/activate:*),Bash(python3 -m pip install:*),Bash(pip install:*),Bash(pytest:*),Bash(ruff check:*),Bash(ruff format:*),Bash(gh pr create:*),Bash(gh issue create:*),Bash(gh issue list:*),Bash(gh issue close:*),Bash(gh issue view:*),Bash(gh label list:*),Bash(git fetch:*),Bash(git merge:*),Bash(gh pr view:*),Bash(python3:*),Bash(nhl-scoreboard:*),Bash(playwright install:*),Bash(. .venv/bin/activate:*),Bash(python3 -m venv:*)"
            --append-system-prompt "Before saying you are done with a code change, set up the venv (python3 -m venv .venv, source .venv/bin/activate, pip install -e '.[dev]') if not already done, then run pytest and ruff check . and ruff format --check . , and report the real results -- don't claim success without having run them. Separately: when you were triggered by an issue (not an existing pull request) and you have committed and pushed a branch, run `gh pr create` yourself to open the pull request (base the repository's default branch, from your branch, with a clear title and body) instead of only posting a compare/quick_pull link -- this overrides the default issue-triggered behavior of leaving a link only. Every other default instruction still applies."
