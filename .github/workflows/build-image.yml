name: Build image

# PRs that touch image-relevant paths must build successfully before they
# can merge -- see the `changes` job below. Do not go back to path-filtering
# at the trigger level (removed from here deliberately): a required check
# whose *workflow* never triggers for a given PR blocks that PR's merge
# forever (GitHub reports it "Pending", not "skipped"/"passed"). Path
# filtering belongs at the job level, where a job skipped via `if:` reports
# as a passing check instead. https://docs.github.com/en/pull-requests/
# collaborating-with-pull-requests/collaborating-on-repositories-with-code-
# quality-features/troubleshooting-required-status-checks
#
# No `push: branches: [main]` trigger, deliberately: release.yml tags and
# releases every merge automatically, then explicitly triggers a real
# build here (workflow_dispatch, against the new tag) -- a separate
# path-filtered build on the merge itself would only ever produce an
# untagged, 14-day-expiring artifact that the tag-triggered build
# immediately supersedes. Pure waste, removed rather than kept "just in
# case". `tags: ["v*"]` stays as a manual fallback (a human pushing a
# real release tag with their own credentials still fires it normally --
# GITHUB_TOKEN-authored pushes don't cascade to this, see release.yml),
# now with no path filter: a human pushing a real tag wants the build
# regardless of what changed.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  # Needed for the "Attach image to release" step (softprops/action-gh-
  # release), which updates the release and uploads assets to it. This
  # workflow had no explicit permissions: block until this line -- it
  # was relying on the repository's default token permissions, and that
  # release-attach step is the only thing here that needs more than the
  # implicit default gives. actions/checkout only needs contents:read
  # (covered); actions/upload-artifact authenticates with its own
  # ACTIONS_RUNTIME_TOKEN, not GITHUB_TOKEN, so it's unaffected by this
  # block either way.
  contents: write

concurrency:
  # One PR's own stacked pushes cancel each other (no reason to finish
  # build #1 once #2 has superseded it); a tag push, a manual dispatch,
  # or a release queues instead, since that run's artifact is the point,
  # not just a gate.
  group: image-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so image builds stay reproducible; bump deliberately.
  RPI_IMAGE_GEN_REF: 85e55c8059cc170f4a96cd0290ecf473520cbfec
  IMAGE_NAME: nhl-scoreboard

jobs:
  # Only gates whether `build` runs *for a pull_request event*; every other
  # trigger (push to main, a tag, workflow_dispatch, a release) always
  # builds regardless -- those aren't merge gates, they're the runs that
  # actually produce a distributable image.
  changes:
    name: Check for image-relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Check which files this PR touches
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                  --paginate --jq '.[].filename')
          echo "$files"
          if echo "$files" | grep -qE '^(image/|src/|fonts/|scripts/fetch-vendor\.sh|\.github/workflows/build-image\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: nhl-scoreboard.img
    needs: [changes]
    # needs: on a job that's conditionally skipped (github.event_name !=
    # 'pull_request', so `changes` never ran) would by default skip this
    # job too; `always()` opts out of that so the explicit condition below
    # is what actually decides it.
    if: >
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true')
    # rpi-image-gen's supported host is Debian/Ubuntu arm64. These runners
    # are free for public repositories and avoid qemu emulation entirely.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout scoreboard
        uses: actions/checkout@v4
        with:
          path: scoreboard

      - name: Checkout rpi-image-gen
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/rpi-image-gen
          ref: ${{ env.RPI_IMAGE_GEN_REF }}
          path: rpi-image-gen

      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Install rpi-image-gen dependencies
        working-directory: rpi-image-gen
        run: |
          set -euxo pipefail
          # install_deps.sh shells out to `apt install` without refreshing the
          # package lists first, which fails on a runner with stale indexes.
          sudo apt-get update -qq
          sudo ./install_deps.sh

      - name: Verify build host
        working-directory: rpi-image-gen
        run: |
          {
            echo "arch: $(uname -m)"
            for tool in mmdebstrap podman genimage bdebstrap; do
              printf '%s: %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
            done
            python3 -c "import yaml, debian" && echo "python deps: ok"
          } > /tmp/host.txt 2>&1
          cat /tmp/host.txt
          msg=$(sed 's/%/%25/g' /tmp/host.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=build host::${msg}"

      - name: Fetch vendored HUB75 driver
        working-directory: scoreboard
        run: ./scripts/fetch-vendor.sh

      - name: Rasterise team logos
        working-directory: scoreboard
        run: |
          sudo apt-get install -y -qq libcairo2
          python3 -m pip install --user --quiet cairosvg pillow requests
          python3 scripts/fetch-logos.py --size 32 --variant both

      - name: Lint the scoreboard layer
        working-directory: rpi-image-gen
        run: |
          ./rpi-image-gen metadata --lint \
            "${GITHUB_WORKSPACE}/scoreboard/image/layer/nhl-scoreboard.yaml"

      - name: Show discovered layers
        working-directory: rpi-image-gen
        continue-on-error: true
        run: |
          ./rpi-image-gen layer --list -S "${GITHUB_WORKSPACE}/scoreboard/image" \
            > /tmp/layers.txt 2>&1 || true
          grep -i scoreboard /tmp/layers.txt || echo "scoreboard layer NOT discovered"
          msg=$(grep -i -A2 -B2 scoreboard /tmp/layers.txt | head -20 \
                | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=layer discovery::${msg:-none}"

      - name: Build image
        working-directory: rpi-image-gen
        run: |
          set -o pipefail
          if ! ./rpi-image-gen build \
                -S "${GITHUB_WORKSPACE}/scoreboard/image" \
                -c scoreboard.yaml 2>&1 | tee /tmp/build.log; then
            # Republish the tail as an ::error:: annotation. Unlike raw job
            # logs, annotations are readable through the public REST API, so
            # a failure can be diagnosed without repository admin rights.
            # GitHub caps annotation messages at ~4KB and keeps the FIRST
            # part, so send only the last few lines -- where the error is.
            msg=$(tail -n 25 /tmp/build.log | tail -c 2000 \
                  | sed 's/%/%25/g; s/\r//g' \
                  | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=rpi-image-gen build failed::${msg}"
            exit 1
          fi

      - name: Locate image
        id: locate
        run: |
          set -euo pipefail
          # rpi-image-gen writes to work/image-<name>/. Look there first and
          # never pipe find into head: under pipefail, head closing the pipe
          # makes find exit non-zero, and root-owned dirs inside the chroot
          # add permission errors on top.
          img=""
          for d in rpi-image-gen/work/image-*/; do
            f="$(find "$d" -maxdepth 2 -name '*.img' -type f -print -quit 2>/dev/null || true)"
            if [ -n "$f" ]; then img="$f"; break; fi
          done
          if [ -z "$img" ]; then
            img="$(find rpi-image-gen/work -path '*/filesystem' -prune -o \
                     -name '*.img' -type f -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$img" ]; then
            echo "::error::No .img produced by the build"
            ls -la rpi-image-gen/work/ rpi-image-gen/work/image-*/ 2>/dev/null || true
            exit 1
          fi
          echo "Found image: $img ($(du -h "$img" | cut -f1))"
          echo "path=$img" >> "$GITHUB_OUTPUT"

      # A pull_request run's whole job is proving the build itself
      # succeeds -- finding a real .img above already does that. Nobody
      # flashes a PR's test build, so compressing it (~85s for ~900MB on
      # the run this was measured against) and uploading it buys nothing
      # for a PR and is skipped. Every other trigger (push to main, a
      # tag, workflow_dispatch, a release) keeps producing the real
      # distributable artifact exactly as before.
      - name: Compress image
        id: artifact
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%d)"
          out="${IMAGE_NAME}-${stamp}-$(git -C scoreboard rev-parse --short HEAD).img"
          mkdir -p deploy
          mv "${{ steps.locate.outputs.path }}" "deploy/${out}"

          echo "Compressing (this is what Imager consumes)..."
          xz -T0 -6 "deploy/${out}"
          ( cd deploy && sha256sum "${out}.xz" > "${out}.xz.sha256" )

          ls -lh deploy/
          echo "name=${out}.xz" >> "$GITHUB_OUTPUT"

      - name: Upload image artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-img
          path: deploy/*
          retention-days: 14
          compression-level: 0

      - name: Attach image to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deploy/*.xz
            deploy/*.sha256
          body: |
            Raspberry Pi image for the NHL scoreboard.

            Flash `${{ steps.artifact.outputs.name }}` with Raspberry Pi Imager
            using **Use custom**, then edit `scoreboard.toml` on the boot
            partition to set your Wi-Fi network and favourite team.
